<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar contraseña - Agenda Salud</title>
  <link rel="icon" type="image/png" href="img/ico.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="align-items-center d-flex py-4 h-100">
    <main class="form-signin w-100 m-auto">
      <form id="forgotForm">
        <h1 class="h3 mb-3 fw-normal">Recuperar contraseña</h1>
        <p class="text-muted">Ingresá tu email y te enviaremos un enlace para restablecer tu contraseña.</p>
        <div class="form-floating">
          <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
          <label for="email">Email</label>
        </div>
        <button class="btn btn-primary w-100 py-2 mt-3 mb-3" type="submit" id="submitBtn">Enviar enlace</button>
      </form>
      <div id="mensaje" class="alert d-none" role="alert"></div>
      <span><a href="login.html" class="text-decoration-none">Volver a iniciar sesión</a></span>
    </main>
  </div>

  <script>
    const form = document.getElementById('forgotForm');
    const mensaje = document.getElementById('mensaje');
    const submitBtn = document.getElementById('submitBtn');

    function mostrarMensaje(texto, tipo) {
      mensaje.textContent = texto;
      mensaje.className = `alert alert-${tipo}`;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      submitBtn.disabled = true;

      try {
        const response = await fetch('/auth/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email }),
        });
        const data = await response.json();
        mostrarMensaje(data.message || 'Revisá tu correo.', 'success');
      } catch (error) {
        console.error(error);
        mostrarMensaje('No se pudo procesar la solicitud. Intentá de nuevo.', 'danger');
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
