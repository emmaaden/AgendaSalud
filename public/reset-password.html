<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nueva contraseña - Agenda Salud</title>
  <link rel="icon" type="image/png" href="img/ico.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
</head>

<body>
  <div class="align-items-center d-flex py-4 h-100">
    <main class="form-signin w-100 m-auto">
      <form id="resetForm">
        <h1 class="h3 mb-3 fw-normal">Definir nueva contraseña</h1>
        <div class="form-floating">
          <input type="password" class="form-control" id="newPassword" placeholder="Nueva contraseña" minlength="6" required>
          <label for="newPassword">Nueva contraseña</label>
        </div>
        <div class="form-floating mt-3">
          <input type="password" class="form-control" id="confirmPassword" placeholder="Repetir contraseña" minlength="6" required>
          <label for="confirmPassword">Repetir contraseña</label>
        </div>
        <button class="btn btn-primary w-100 py-2 mt-3 mb-3" type="submit" id="submitBtn" disabled>Guardar contraseña</button>
      </form>
      <div id="mensaje" class="alert d-none" role="alert"></div>
      <span><a href="login.html" class="text-decoration-none">Volver a iniciar sesión</a></span>
    </main>
  </div>

  <script>
    const form = document.getElementById('resetForm');
    const mensaje = document.getElementById('mensaje');
    const submitBtn = document.getElementById('submitBtn');
    let supabaseClient = null;
    let recoveryReady = false;

    function mostrarMensaje(texto, tipo) {
      mensaje.textContent = texto;
      mensaje.className = `alert alert-${tipo}`;
    }

    function habilitarFormulario() {
      recoveryReady = true;
      submitBtn.disabled = false;
    }

    async function init() {
      let cfg;
      try {
        cfg = await fetch('/api/public-config').then(r => r.json());
      } catch (e) {
        mostrarMensaje('No se pudo obtener la configuración del servidor.', 'danger');
        return;
      }
      if (!cfg.supabaseUrl || !cfg.supabaseAnonKey) {
        mostrarMensaje('Falta configurar SUPABASE_KEY_PUBLIC en el servidor.', 'danger');
        return;
      }

      supabaseClient = supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);

      // El enlace de recuperación trae el token en la URL. supabase-js lo detecta
      // y emite PASSWORD_RECOVERY (flujo implícito con # en la URL).
      supabaseClient.auth.onAuthStateChange((event, session) => {
        if (event === 'PASSWORD_RECOVERY' || (session && event === 'SIGNED_IN')) {
          habilitarFormulario();
        }
      });

      // Fallback flujo PKCE: el enlace trae ?code=...
      const params = new URLSearchParams(window.location.search);
      if (params.get('code')) {
        try {
          const { error } = await supabaseClient.auth.exchangeCodeForSession(window.location.href);
          if (!error) habilitarFormulario();
        } catch (e) { /* ignorado: se evalúa la sesión abajo */ }
      }

      // Fallback: si el hash ya fue procesado y hay sesión activa.
      setTimeout(async () => {
        const { data } = await supabaseClient.auth.getSession();
        if (data.session) {
          habilitarFormulario();
        } else if (!recoveryReady) {
          mostrarMensaje('Abrí esta página desde el enlace del email de recuperación.', 'warning');
        }
      }, 900);
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!supabaseClient || !recoveryReady) return;

      const password = document.getElementById('newPassword').value;
      const confirm = document.getElementById('confirmPassword').value;
      if (password !== confirm) {
        mostrarMensaje('Las contraseñas no coinciden.', 'danger');
        return;
      }

      submitBtn.disabled = true;
      const { error } = await supabaseClient.auth.updateUser({ password });
      if (error) {
        mostrarMensaje(`No se pudo actualizar: ${error.message}`, 'danger');
        submitBtn.disabled = false;
        return;
      }

      mostrarMensaje('Contraseña actualizada. Redirigiendo al login...', 'success');
      setTimeout(() => { window.location.href = '/login.html'; }, 2000);
    });

    init();
  </script>
</body>
</html>
